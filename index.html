<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voxelcraft</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='6' fill='%236aaa40'/%3E%3Crect y='6' width='16' height='10' fill='%23866043'/%3E%3C/svg%3E" />
    <style>
      html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: #000; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; }

      .hud { position: fixed; font-family: 'Courier New', monospace; color: #fff; user-select: none; pointer-events: none; }

      #crosshair {
        left: 50%; top: 50%; transform: translate(-50%, -50%);
        font-size: 22px; text-shadow: 0 0 2px #000; opacity: 0.85;
      }

      #fps { left: 8px; top: 6px; font-size: 13px; text-shadow: 1px 1px 0 #000; }
      #debug { left: 8px; top: 24px; font-size: 12px; text-shadow: 1px 1px 0 #000; white-space: pre; display: none; }
      #toast {
        left: 50%; top: 20%; transform: translateX(-50%);
        font-size: 16px; text-shadow: 1px 1px 0 #000; opacity: 0; transition: opacity 0.4s;
      }

      #hotbar {
        left: 50%; bottom: 10px; transform: translateX(-50%);
        display: flex; gap: 4px; padding: 4px;
        background: rgba(0, 0, 0, 0.35); border-radius: 4px;
      }
      .slot {
        width: 46px; height: 46px; border: 2px solid #666; border-radius: 3px;
        background: rgba(20, 20, 20, 0.5); position: relative;
      }
      .slot.selected { border-color: #fff; }
      .slot canvas { width: 100%; height: 100%; image-rendering: pixelated; }
      .slot .key {
        position: absolute; left: 3px; top: 1px; font-size: 10px; color: #ddd;
        text-shadow: 1px 1px 0 #000;
      }

      #water-overlay {
        inset: 0; background: rgba(20, 60, 160, 0.35); display: none;
      }

      #menu {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 14px;
        background: rgba(0, 0, 0, 0.6); color: #fff;
        font-family: 'Courier New', monospace; cursor: pointer; z-index: 10;
      }
      #menu h1 { margin: 0; font-size: 42px; letter-spacing: 3px; text-shadow: 3px 3px 0 #2a2a2a; }
      #menu .hint { font-size: 18px; animation: pulse 1.6s infinite; }
      #menu table { font-size: 14px; color: #ccc; border-spacing: 12px 3px; }
      #menu td:first-child { color: #fff; text-align: right; }
      @keyframes pulse { 50% { opacity: 0.4; } }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="water-overlay" class="hud"></div>
    <div id="crosshair" class="hud">+</div>
    <div id="fps" class="hud"></div>
    <div id="debug" class="hud"></div>
    <div id="toast" class="hud"></div>
    <div id="hotbar" class="hud"></div>
    <div id="menu">
      <h1>VOXELCRAFT</h1>
      <div class="hint">Click to play</div>
      <table>
        <tr><td>W A S D</td><td>move</td></tr>
        <tr><td>Mouse</td><td>look</td></tr>
        <tr><td>Space</td><td>jump / swim up</td></tr>
        <tr><td>Shift</td><td>sneak / swim down</td></tr>
        <tr><td>Left click</td><td>break block</td></tr>
        <tr><td>Right click</td><td>place block</td></tr>
        <tr><td>1-9 / wheel</td><td>select block</td></tr>
        <tr><td>[ / ]</td><td>view distance</td></tr>
        <tr><td>T</td><td>skip time</td></tr>
        <tr><td>F3</td><td>debug info</td></tr>
        <tr><td>Esc</td><td>release mouse</td></tr>
      </table>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
